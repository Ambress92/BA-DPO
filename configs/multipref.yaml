experiment_name: multipref
output_dir: experiments/multipref
datasets: [multipref]
attribute: length             # one of src/attributes.py
length_ratio: 1.5             # g=1 only for a response >= 1.5x its partner: 59% cross-group, offline theta 0.99
seeds: [42, 123, 456]          # EVERY arm gets all three seeds, including dpo and pooled

hf_dataset: allenai/multipref
heldout_prompt_frac: 0.1
n_eval_prompts: 300

# Shared training recipe, the same for every arm
model: Qwen/Qwen2.5-0.5B-Instruct
adapter: none                      # none = full fine-tune; lora = frozen bf16 base + fp32 LoRA adapters
lora_r: 16
lora_alpha: 32
lora_target: all-linear
precision: fp32_master_bf16_autocast
gpu_memory_cap_gb: 24         # hard per-process cap
beta: 0.1
lr: 5.0e-7
steps: 1000
gradient_checkpointing: false  # identical gradients either way; steps 19-41% faster,
                               # peak memory about 19 GB instead of 10.7 GB
sort_by_length: true           # group each update's pairs by length: same pairs and loss, less padding
                               # (identical in fp32, bf16 rounding only)
batch_size: 2
grad_accum: 16
max_length: 1280
max_prompt_length: 384
schedule: cosine
warmup_frac: 0.1

# Bias-parameter optimisation.
theta_lr: 1.0e-2
theta_penalty_lambda: 0.0     # mean-zero penalty. 0 for the main runs: with m=1 a nonzero
                              # lambda shrinks the pooled theta directly and confounds the
                              # saturation claim.

gen_max_new_tokens: 512
gen_temperature: 0.7
gen_top_p: 0.9
judge: Skywork/Skywork-Reward-V2-Qwen3-1.7B   # 3.5 GB, runs alongside training
judge_max_length: 2048

# Reference SFT: one checkpoint shared by every method and seed (experiments/shared/reference)
sft_lr: 1.0e-5
sft_epochs: 1

methods:
  reference: {}
  dpo: {}
  barp_pooled: {n_bias_params: 1}
  barp_annotator: {n_bias_params: per_annotator}
  barp_shuffled: {n_bias_params: per_annotator, shuffle_annotator_ids: true}
  barp_annotator_mean: {n_bias_params: per_annotator, shared_mean: true}   # theta_k = theta_bar + eps_k
  barp_annotator_mean_warm: {n_bias_params: per_annotator, shared_mean: true, theta_init: offline}   # theta_bar warm-started at the offline pooled estimate
  barp_pooled_warm: {n_bias_params: 1, theta_init: offline}
  rdpo: {alpha: 0.02}                    # length-penalised DPO, Park et al. 2024
  rdpo_a005: {alpha: 0.005}              # alpha=0.02 collapsed the responses in a pilot (90 tokens, chance accuracy)
  sampo: {}                              # down-sampled KL, Lu et al. 2024
