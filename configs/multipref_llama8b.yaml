# MultiPref (length) on Llama-3.1-8B-Instruct with LoRA. Same data,
# attribute and readouts as configs/multipref.yaml; model and training recipe as
# configs/names_v3_llama8b.yaml, from the 0.5B LoRA calibration.
experiment_name: multipref_llama8b
output_dir: experiments/multipref_llama8b
datasets: [multipref]
# The shared reference folder is named after the data by default, which would hand this run the
# 0.5B reference and its cached log-probs. The 8B reference gets its own folder.
reference_name: multipref_llama8b
attribute: length
length_ratio: 1.5             # as configs/multipref.yaml: 59% cross-group, offline theta 0.99
seeds: [42, 123, 456]

hf_dataset: allenai/multipref
heldout_prompt_frac: 0.1
n_eval_prompts: 300

model: meta-llama/Llama-3.1-8B-Instruct
adapter: lora
lora_r: 32
lora_alpha: 64
lora_target: all-linear
precision: bf16_base_fp32_adapters
gpu_memory_cap_gb: 24         # measured peak 21.5 GB
beta: 0.1
lr: 5.0e-6                    # LoRA calibration: ten times the full fine-tuning rate, not more
steps: 1000
sort_by_length: true           # group each update's pairs by length: same pairs and loss, less padding
                               # (identical in fp32, bf16 rounding only)
batch_size: 2
grad_accum: 16
max_length: 1280
max_prompt_length: 384
schedule: cosine
warmup_frac: 0.1
theta_lr: 1.0e-2
theta_penalty_lambda: 0.0

gen_max_new_tokens: 512
gen_temperature: 0.7
gen_top_p: 0.9
judge: Skywork/Skywork-Reward-V2-Qwen3-1.7B
judge_max_length: 2048
sft_lr: 1.0e-4                # the reference SFT is LoRA as well: ten times the full fine-tuning 1e-5
sft_epochs: 1

# Every arm at three seeds.
methods:
  reference: {}
  dpo: {}
  barp_pooled: {n_bias_params: 1}
  barp_annotator_mean: {n_bias_params: per_annotator, shared_mean: true}
  rdpo_a005: {alpha: 0.005}                  # as at 0.5B; alpha 0.02 collapsed the answers there
  sampo: {}
  group_dro_dpo: {n_groups: per_annotator, eta: 0.5}
