# MultiPref, formatting (markdown presence), on Llama-3.1-8B-Instruct with LoRA.
# Same data and readouts as configs/multipref_formatting.yaml;
# model and recipe as configs/multipref_llama8b.yaml. dpo, rdpo_a005 and sampo are not trained
# here: scripts/setup/link_multipref_formatting.sh links their length checkpoints, which this
# config scores under formatting (none of them reads the attribute).
experiment_name: multipref_formatting_llama8b
output_dir: experiments/multipref_formatting_llama8b
data_dir_name: multipref_formatting          # g_chosen/g_rejected computed by the formatting attribute
reference_name: multipref_llama8b            # the 8B MultiPref reference: SFT never reads the attribute
datasets: [multipref]
attribute: formatting
seeds: [42, 123, 456]

hf_dataset: allenai/multipref
heldout_prompt_frac: 0.1
n_eval_prompts: 300
data_seed: 0                                 # same split as the length experiment

model: meta-llama/Llama-3.1-8B-Instruct
adapter: lora
lora_r: 32
lora_alpha: 64
lora_target: all-linear
precision: bf16_base_fp32_adapters
gpu_memory_cap_gb: 24         # measured peak 21.5 GB on the length runs
beta: 0.1
lr: 5.0e-6
steps: 1000
sort_by_length: true           # group each update's pairs by length: same pairs and loss, less padding
                               # (identical in fp32, bf16 rounding only)
batch_size: 2
grad_accum: 16
max_length: 1280
max_prompt_length: 384
schedule: cosine
warmup_frac: 0.1
theta_lr: 1.0e-2
theta_penalty_lambda: 0.0

gen_max_new_tokens: 512
gen_temperature: 0.7
gen_top_p: 0.9
judge: Skywork/Skywork-Reward-V2-Qwen3-1.7B
judge_max_length: 2048
sft_lr: 1.0e-4
sft_epochs: 1

methods:
  dpo: {}                                    # linked from multipref_llama8b, scored only
  barp_pooled: {n_bias_params: 1}
  barp_annotator_mean: {n_bias_params: per_annotator, shared_mean: true}
  rdpo_a005: {alpha: 0.005}                  # linked from multipref_llama8b, scored only
  sampo: {}                                  # linked from multipref_llama8b, scored only
