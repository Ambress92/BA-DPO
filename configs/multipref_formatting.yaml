experiment_name: multipref_formatting
output_dir: experiments/multipref_formatting
data_dir_name: multipref_formatting          # separate data build: g_chosen/g_rejected computed
                                              # by the formatting attribute, not length
datasets: [multipref]
attribute: formatting
seeds: [42, 123, 456]

hf_dataset: allenai/multipref
heldout_prompt_frac: 0.1
n_eval_prompts: 300
data_seed: 0                                 # same split as multipref.yaml: same prompts held out

model: Qwen/Qwen2.5-0.5B-Instruct
adapter: none
lora_r: 16
lora_alpha: 32
lora_target: all-linear
precision: fp32_master_bf16_autocast
gpu_memory_cap_gb: 24
beta: 0.1
lr: 5.0e-7
steps: 1000
batch_size: 2
grad_accum: 16
max_length: 1280
max_prompt_length: 384
schedule: cosine
warmup_frac: 0.1

theta_lr: 1.0e-2
theta_penalty_lambda: 0.0

gen_max_new_tokens: 512
gen_temperature: 0.7
gen_top_p: 0.9
judge: Skywork/Skywork-Reward-V2-Qwen3-1.7B
judge_max_length: 2048

sft_lr: 1.0e-5
sft_epochs: 1

# dpo is listed so its row gets *evaluated* fresh under the formatting attribute (attr
# rate, held-out accuracy), but the checkpoint itself is reused via symlink from
# experiments/multipref/dpo (see scripts/setup/link_multipref_formatting.sh): DPO's
# loss never uses g_chosen/g_rejected (theta stays 0), so the checkpoint is identical
# regardless of which attribute config trained it. Reference is reused the same way.
methods:
  dpo: {}
  barp_pooled: {n_bias_params: 1}
  barp_annotator: {n_bias_params: per_annotator}
  barp_shuffled: {n_bias_params: per_annotator, shuffle_annotator_ids: true}
  barp_annotator_mean: {n_bias_params: per_annotator, shared_mean: true}
