# names_v3 on Mistral-7B-Instruct-v0.3 with LoRA: a second 7B to 8B model family next to
# Llama-3.1-8B. Same data, planted biases, readouts and LoRA recipe as
# configs/names_v3_llama8b.yaml; only the model name changes.
experiment_name: names_v3_mistral7b
output_dir: experiments/names_v3_mistral7b
datasets: [names]
data_dir_name: names_v3
# The shared reference folder is named after the data by default, which would hand this run
# the 0.5B reference and its cached log-probs. The 7B reference gets its own folder.
reference_name: names_v3_mistral7b
attribute: names
seeds: [42, 123, 456]

# Data keys: identical to configs/names_v3.yaml (the data is not rebuilt; data_seed also
# seeds the random re-signing of the SFT answers).
name_pool: v2
sft_resign_random: true
annotators_per_class: 20
theta_sigma: 0.8
classes:
  - {name: A, mean: [1.2, 2.5]}
  - {name: B, mean: [0.8, -0.5]}
  - {name: C, mean: [1.0, 1.0]}
pair_mix: {quality: 0.4, swap: 0.2, mixed: 0.4}
quality_unsigned_frac: 0.5
judgments_per_pair: 4
n_pairs: 8000
quality_scale: 0.5
data_seed: 0
n_eval_prompts: 300
n_choice_prompts: 100

model: mistralai/Mistral-7B-Instruct-v0.3
adapter: lora
lora_r: 32
lora_alpha: 64
lora_target: all-linear
precision: bf16_base_fp32_adapters
gpu_memory_cap_gb: 24         # measured peak 17.7 to 21.5 GB
beta: 0.1
lr: 5.0e-6                    # LoRA calibration: passes at 5e-6; at 2e-5 the policy outruns theta
steps: 1000
sort_by_length: true           # group each update's pairs by length: same pairs and loss, less padding
                               # (identical in fp32, bf16 rounding only)
batch_size: 2
grad_accum: 16
max_length: 1280
max_prompt_length: 384
schedule: cosine
warmup_frac: 0.1
theta_lr: 1.0e-2
theta_penalty_lambda: 0.0

gen_max_new_tokens: 512
gen_temperature: 0.7
gen_top_p: 0.9
judge: Skywork/Skywork-Reward-V2-Qwen3-1.7B
judge_max_length: 2048
sft_lr: 1.0e-4                # the reference SFT is LoRA as well: ten times the full fine-tuning
                              # 1e-5, the same rule as for DPO
sft_epochs: 1

# Reference, dpo, pooled and shared mean at three seeds; no baselines here.
methods:
  reference: {}
  dpo: {}
  barp_pooled: {n_bias_params: 1}
  barp_annotator_mean: {n_bias_params: per_annotator, shared_mean: true}
